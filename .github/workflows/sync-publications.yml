name: Sync Publications & Dossiers

on:
  schedule:
    # Run once daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-laws:
    name: Sync Latest Research & Autonomous Weapons Dossiers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sync Engine
        run: |
          python scripts/sync_awesome_list.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --staged --quiet || (git commit -m "chore(sync): update curated autonomous weapons dossiers" && git push)
